[project]
name = "podcast"
version = "0.1.0"
description = "AI MedStudio"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "F401", # imported but unused (will fix manually later)
    "UP035", # deprecated typing imports (keep compatibility)
]
